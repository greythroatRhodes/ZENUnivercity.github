<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048ゲーム | ゆずのページ</title>
  <style>
    body {
      background-color: #fdf3f5;
      color: #444444;
      font-family: sans-serif;
      margin: 40px auto;
      max-width: 480px;
      padding: 0 16px;
      line-height: 1.8;
      text-align: center;
    }
    h1 {
      color: #d1768a;
      border-bottom: 3px solid #f3c6d3;
      padding-bottom: 8px;
    }
    .scores {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
    }
    .score-box {
      background-color: #f3c6d3;
      border-radius: 8px;
      padding: 6px 18px;
      font-weight: bold;
    }
    .score-box span {
      display: block;
      font-size: 20px;
    }
    button {
      background-color: #f3c6d3;
      color: #444444;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    #board {
      background-color: #e8a7bb;
      border-radius: 12px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      aspect-ratio: 1;
      touch-action: none;
      user-select: none;
    }
    .cell {
      background-color: #fbe9ee;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 28px;
      color: #776e65;
    }
    .t2    { background-color: #fce4ec; }
    .t4    { background-color: #f8bbd0; }
    .t8    { background-color: #f48fb1; color: #ffffff; }
    .t16   { background-color: #f06292; color: #ffffff; }
    .t32   { background-color: #ec407a; color: #ffffff; }
    .t64   { background-color: #e91e63; color: #ffffff; }
    .t128  { background-color: #f6d365; color: #ffffff; font-size: 24px; }
    .t256  { background-color: #f6c945; color: #ffffff; font-size: 24px; }
    .t512  { background-color: #f0b429; color: #ffffff; font-size: 24px; }
    .t1024 { background-color: #de911d; color: #ffffff; font-size: 20px; }
    .t2048 { background-color: #cb8a14; color: #ffffff; font-size: 20px; }
    #message {
      min-height: 1.8em;
      font-weight: bold;
      color: #b0526b;
    }
    a { color: #b0526b; }
  </style>
</head>
<body>
  <h1>2048ゲーム</h1>
  <p>矢印キー（WASDでも可）かスワイプでタイルを動かして、同じ数字をくっつけていくゲーム。2048を作れば勝ち。</p>

  <div class="scores">
    <div class="score-box">スコア<span id="score">0</span></div>
    <div class="score-box">ベスト<span id="best">0</span></div>
  </div>
  <button id="new-game">新しいゲーム</button>

  <div id="board"></div>
  <p id="message"></p>

  <p><a href="index.html">トップページへ戻る</a></p>

  <script>
    'use strict';

    const size = 4;
    let board = [];
    let score = 0;
    let best = Number(localStorage.getItem('best2048') || 0);
    let over = false;
    let won = false;

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const messageEl = document.getElementById('message');

    function init() {
      board = [];
      for (let r = 0; r < size; r++) {
        board.push([0, 0, 0, 0]);
      }
      score = 0;
      over = false;
      won = false;
      addRandom();
      addRandom();
      render();
    }

    // 空いているマスに 2（たまに 4）を置く
    function addRandom() {
      const empty = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) {
            empty.push([r, c]);
          }
        }
      }
      if (empty.length === 0) {
        return;
      }
      const spot = empty[Math.floor(Math.random() * empty.length)];
      board[spot[0]][spot[1]] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const v = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell' + (v ? ' t' + v : '');
          cell.textContent = v ? v : '';
          boardEl.appendChild(cell);
        }
      }
      scoreEl.textContent = score;
      bestEl.textContent = best;
      if (over) {
        messageEl.textContent = 'ゲームオーバー！「新しいゲーム」でもう一度どうぞ。';
      } else if (won) {
        messageEl.textContent = '2048達成！おめでとう！そのまま続けることもできます。';
      } else {
        messageEl.textContent = '';
      }
    }

    // 1行を左に詰めて、同じ数字を合体させる
    function slide(row) {
      const arr = row.filter(v => v !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] = arr[i] * 2;
          score += arr[i];
          if (arr[i] === 2048) {
            won = true;
          }
          arr.splice(i + 1, 1);
        }
      }
      while (arr.length < size) {
        arr.push(0);
      }
      return arr;
    }

    function moveLeft(b) {
      return b.map(row => slide(row));
    }

    function transpose(b) {
      return b[0].map((_, i) => b.map(r => r[i]));
    }

    function reverseRows(b) {
      return b.map(r => r.slice().reverse());
    }

    function move(dir) {
      if (over) {
        return;
      }
      let nb;
      if (dir === 'left') {
        nb = moveLeft(board);
      } else if (dir === 'right') {
        nb = reverseRows(moveLeft(reverseRows(board)));
      } else if (dir === 'up') {
        nb = transpose(moveLeft(transpose(board)));
      } else {
        nb = transpose(reverseRows(moveLeft(reverseRows(transpose(board)))));
      }
      if (JSON.stringify(nb) === JSON.stringify(board)) {
        return;
      }
      board = nb;
      addRandom();
      if (score > best) {
        best = score;
        localStorage.setItem('best2048', best);
      }
      if (!canMove()) {
        over = true;
      }
      render();
    }

    function canMove() {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) {
            return true;
          }
          if (c + 1 < size && board[r][c] === board[r][c + 1]) {
            return true;
          }
          if (r + 1 < size && board[r][c] === board[r + 1][c]) {
            return true;
          }
        }
      }
      return false;
    }

    document.addEventListener('keydown', (e) => {
      const keys = {
        ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
        a: 'left', d: 'right', w: 'up', s: 'down'
      };
      const dir = keys[e.key];
      if (dir) {
        e.preventDefault();
        move(dir);
      }
    });

    // スマホのスワイプ対応
    let startX = 0;
    let startY = 0;
    boardEl.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    boardEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) {
        return;
      }
      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? 'right' : 'left');
      } else {
        move(dy > 0 ? 'down' : 'up');
      }
    });

    document.getElementById('new-game').addEventListener('click', init);

    init();
  </script>
</body>
</html>
